<script>
 function middlewareInTheMiddle(command, target, host){
    fetch(`http://thinkfortwice/meow?command=${command}&target=${target}&host=${host}`, {
    method: 'GET',
    mode: 'cors',
    headers:{
    'Access-Control-Allow-Origin' : '*',
    'Access-Control-Allow-Methods' : 'GET, POST, PUT, DELETE'
    }
    })
          }
</script>

<div class="row">
